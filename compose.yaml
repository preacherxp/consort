# Standalone deployment. For your existing Caddy stack use deploy/compose.jev.yaml instead.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - purecode
    depends_on:
      jev:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jev:
    image: ${JEV_IMAGE:-ghcr.io/preacherxp/consort:latest}
    build:
      context: .
    restart: unless-stopped
    init: true
    stop_grace_period: 70s
    depends_on:
      jev-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3007"
      APP_ORIGIN: https://jev.purecode.sh
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set an OpenRouter key with a spending cap}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL_ID: typesafe/jev-1.13
      POSTGRES_HOST: jev-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated Consort database password}
    expose:
      - "3007"
    networks:
      - purecode
      - jev_storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jev-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a separate database bootstrap password}
      CONSORT_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated Consort database password}
    volumes:
      - jev_db_data:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/consort.sh:ro
    networks:
      - jev_storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  jev_db_data:

networks:
  purecode:
    driver: bridge
  jev_storage:
    internal: true
